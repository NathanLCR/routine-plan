<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Routine Plan</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <main>
      <a class="back-link" href="index.html">Back to week</a>

      <header id="day-header">
        <div class="topline" id="day-pills"></div>
        <h1 id="day-title">Daily Plan</h1>
        <p class="lede" id="day-lede"></p>
      </header>

      <nav class="day-nav" aria-label="Other days">
        <a class="pill" href="day.html?day=monday">Monday</a>
        <a class="pill" href="day.html?day=tuesday">Tuesday</a>
        <a class="pill" href="day.html?day=wednesday">Wednesday</a>
        <a class="pill" href="day.html?day=thursday">Thursday</a>
        <a class="pill" href="day.html?day=friday">Friday</a>
        <a class="pill" href="day.html?day=saturday">Saturday</a>
        <a class="pill" href="day.html?day=sunday">Sunday</a>
      </nav>

      <section class="day-layout" aria-label="Daily details">
        <div class="detail-card">
          <span class="label">Timeline</span>
          <div class="timeline" id="timeline"></div>
        </div>

        <aside class="detail-stack">
          <article class="detail-card">
            <span class="label">Main Output</span>
            <p id="main-output"></p>
          </article>
          <article class="detail-card">
            <span class="label">Minimum Version</span>
            <p id="minimum-version"></p>
          </article>
          <article class="detail-card">
            <span class="label">Guardrail</span>
            <p id="guardrail"></p>
          </article>
        </aside>
      </section>

      <section class="grid-3" aria-label="Study details">
        <article class="detail-card">
          <span class="label">Topics</span>
          <ul id="topics"></ul>
        </article>
        <article class="detail-card">
          <span class="label">Resources</span>
          <ul class="resource-list" id="resources"></ul>
        </article>
        <article class="detail-card">
          <span class="label">End Check</span>
          <ul id="checks"></ul>
        </article>
      </section>

      <section class="footer-review">
        <h2>Tomorrow Prep</h2>
        <p id="tomorrow-prep"></p>
      </section>
    </main>

    <script>

          resources: [

        },
        friday: {
          title: "Friday 22 May",

          minimum: "Attend online classes, eat, and recover.",
          guardrail: "Do not turn recovery into a hidden study block.",
          tomorrow: "Saturday is a full work day. Choose one tiny maintenance task before the shift.",
          timeline: [
            ["09:15-09:55", "Online setup", "Laptop, charger, water, notes, and a quiet class space."],
            ["10:00-12:00", "Online Deep Learning", "Capture only the points that affect CA01 or next week's study."],
            ["12:00-14:00", "Online Recommender Systems", "Track assessment, model, or evaluation hints."],

            ["14:45-15:30", "Optional light review", "Only if needed: 30-45 minutes to avoid losing class notes."],

          ],
          topics: [
            "DL: only urgent class follow-up, especially CA01.",
            "RS: only urgent class follow-up, especially CA1 group project hints.",
            "Recovery: reduce sleep debt before Saturday/Sunday shifts."

          resources: [
            ["Workspace", "Deep Learning module guide", "docs/course-materials/deep-learning-module-guide.pdf"],
            ["Workspace", "Recommender Systems assessment guide", "docs/course-materials/recommender-systems-module-assessment-guide-2026.pdf"],
            ["Workspace", "Study progress tracker", "tasks/STUDY_PROGRESS.md"],
            ["External", "PyTorch tutorials", "https://docs.pytorch.org/tutorials/"],
            ["External", "MovieLens datasets", "https://grouplens.org/datasets/movielens/"]

            "Did I capture urgent class follow-ups?",

            "Am I set up for the Saturday shift?"

        },
        saturday: {
          title: "Saturday 23 May",
          type: "Work day",
          pillClass: "work",
          lede: "Six by Nico 10:00-00:00. This is maintenance only.",
          output: "15-25 minutes maximum: flashcards or tomorrow check.",
          minimum: "Prepare for work, survive the shift, sleep.",
          guardrail: "No serious study after the shift.",
          tomorrow: "Before Sunday shift, choose whether weekly planning is realistic after work or should move to Monday.",

            ["09:30-09:50", "Optional maintenance", "Flashcards or one small note cleanup. Stop quickly."],
            ["10:00-00:00", "Six by Nico", "Full work day. The academic goal is simply to protect momentum."],
            ["After shift", "Shutdown", "Food, shower, and sleep. Do not negotiate with midnight ambition."]
          ],
          topics: [
            "Maintenance: flashcards from this week's classes.",
            "Optional: one short dissertation paper section.",

          ],
          checks: [
            "Did I keep maintenance under 25 minutes?",
            "Did I avoid heavy academic work?",

        },
        sunday: {
          title: "Sunday 24 May",
          type: "Work day",
          pillClass: "work",
          lede: "Six by Nico 10:00-00:00. Maintenance only, with weekly planning only if energy allows.",
          output: "Minimum: tomorrow check. Optional: next week's top 3 priorities.",
          minimum: "Prepare for work, finish the shift, sleep. Planning can move to Monday.",
          guardrail: "If you are tired, sleep wins. Planning is not a moral test.",
          tomorrow: "If weekly planning moved, do it Monday morning before class: top 3 priorities only.",
          timeline: [
            ["08:30-09:30", "Pre-shift setup", "Food, water, uniform, commute buffer, and choose the lowest-effort maintenance task."],
            ["09:30-09:50", "Optional maintenance", "Tomorrow check or one short flashcard pass."],
            ["10:00-00:00", "Six by Nico", "Full work day. Keep the academic target deliberately small."],
            ["After shift", "Weekly check", "If alert, choose next week's top 3 in 10 minutes. If tired, move it to Monday morning."]
          ],
          topics: [
            "Maintenance: tomorrow check, next-week priorities, or one flashcard pass.",
            "Weekly review: what moved, what slipped, what caused friction.",
            "Recovery: protect sleep before the next academic cycle."
          ],
          resources: [
            ["Workspace", "Weekly plan", "tasks/WEEKLY_PLAN.md"],
            ["Workspace", "TODO list", "tasks/TODO.md"],
            ["Workspace", "Study progress tracker", "tasks/STUDY_PROGRESS.md"],
            ["Workspace", "Operating profile", "context/OPERATING_PROFILE.md"]
          ],
          checks: [
            "What moved forward this week?",
            "What slipped?",
            "What are next week's top 3 priorities?"
          ]
        }
      };

      const dayOrder = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
      const params = new URLSearchParams(window.location.search);
      const key = plans[params.get("day")] ? params.get("day") : "monday";
      const plan = plans[key];

      document.title = `${plan.title} Routine Plan`;
      document.getElementById("day-title").textContent = plan.title;
      document.getElementById("day-lede").textContent = plan.lede;
      document.getElementById("main-output").textContent = plan.output;
      document.getElementById("minimum-version").textContent = plan.minimum;
      document.getElementById("guardrail").textContent = plan.guardrail;
      document.getElementById("tomorrow-prep").textContent = plan.tomorrow;

      const pill = document.createElement("span");
      pill.className = `pill ${plan.pillClass}`.trim();
      pill.textContent = plan.type;
      document.getElementById("day-pills").appendChild(pill);

      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      document.getElementById("timeline").innerHTML = plan.timeline
        .map(([time, title, detail]) => `
          <div class="slot">
            <span class="slot-time">${escapeHtml(time)}</span>
            <div>
              <strong>${escapeHtml(title)}</strong>
              <p>${escapeHtml(detail)}</p>
            </div>
          </div>
        `)
        .join("");

      document.getElementById("topics").innerHTML = plan.topics
        .map((topic) => `<li>${escapeHtml(topic)}</li>`)
        .join("");

      document.getElementById("checks").innerHTML = plan.checks
        .map((check) => `<li>${escapeHtml(check)}</li>`)
        .join("");

      document.getElementById("resources").innerHTML = plan.resources
        .map(([kind, label, value]) => {
          const isUrl = /^https?:\/\//.test(value);
          const renderedValue = isUrl
            ? `<a href="${escapeHtml(value)}">${escapeHtml(value)}</a>`
            : `<code>${escapeHtml(value)}</code>`;
          return `
            <li>
              <span class="resource-kind">${escapeHtml(kind)}</span>
              <strong>${escapeHtml(label)}</strong>
              <p>${renderedValue}</p>
            </li>
          `;
        })
        .join("");

      document.querySelectorAll(".day-nav a").forEach((link) => {
        const linkKey = new URL(link.href).searchParams.get("day");
        if (linkKey === key) {
          link.setAttribute("aria-current", "page");
        }
      });
    </script>
  </body>
</html>
